[project]
name = "bank-alfa-mortgage-demo"
version = "0.1.0"
description = "Bank Alfa Mortgage AI Demo — FastAPI backend (Microsoft Foundry Voice Live + Content Understanding)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "python-multipart>=0.0.12",
    "httpx>=0.27",
    "azure-identity>=1.19",
    "azure-ai-voicelive[aiohttp]>=1.3.0",
]

[project.optional-dependencies]
# Multi-agent orchestration showcase (app/agents). Optional so the runtime image and
# offline CI stay lean; the code degrades gracefully when this is not installed.
agents = [
    "agent-framework>=1.0.0",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    # Generation-only: builds the committed high-confidence payslip PDF
    # (scripts/generate_payslip_pdf.py). Not needed at runtime — the PDF is
    # committed static — so it stays out of the runtime dependency set.
    "reportlab>=4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]
